
name: Build Manka

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build Spring Boot
        run: bash ./mvnw -B -Dmaven.test.skip=true package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: manka-jar
          path: target/manka-0.0.1-SNAPSHOT.jar
          retention-days: 7
